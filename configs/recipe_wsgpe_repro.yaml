# ⚠️  此文件已废弃！WSGPE 配方已整合到 config/recipe.yaml 的 recipes.wsgpe_repro 中。
# 
# 请使用统一配置:
#   config/recipe.yaml
#
# 如需使用 WSGPE 配方，请参考:
#   config/recipe.yaml 中的 recipes.wsgpe_repro 部分
#
# ==============================================================================
# [原始配置 - 仅供参考]
# ==============================================================================

recipe:
  system:
    name: "WSGPE_Reproduction_Final"
    target_density_g_cm3: 1.30
    box_shape: "cubic"
    basis_mass_g: 100.0

  packmol:
    tolerance_A: 2.2
    box_scale: 2.5     # 保持较大的盒子，确保50条长链能塞进去
    seed: 12345
    filetype: "pdb"
    output_pdb: "gel.pdb"

  # ============================================================================
  # 关键修改: 使用 'components' 列表，不使用 salt_solution/polymer_matrix
  # 将所有 5 种分子平铺在这里
  # ============================================================================
  components:
    # 1. 锂离子 (Li+) - 485个
    - id: "ion_li"
      name: "Li"
      file: "molecules/Li.pdb"
      count: 485
      mw_g_mol: 6.94
      charge: 1.0

    # 2. TFSI 阴离子 (TFSI-) - 485个
    - id: "ion_tfsi"
      name: "TFSI"
      file: "molecules/TFSI.pdb"
      count: 485
      mw_g_mol: 280.15
      charge: -1.0

    # 3. 溶剂 A (FEP) - 2325个
    - id: "solvent_fep"
      name: "FEP"
      file: "molecules/FEP.pdb"
      count: 2325
      mw_g_mol: 156.10
      charge: 0.0

    # 4. 溶剂 B (FEC) - 680个
    - id: "solvent_fec"
      name: "FEC"
      file: "molecules/FEC.pdb"
      count: 680
      mw_g_mol: 106.05
      charge: 0.0

    # 5. 聚合物 (PTFMA) - 50个
    - id: "polymer_ptfma"
      name: "PTFMA"
      file: "molecules/PTFMA.pdb"
      count: 50
      mw_g_mol: 5000.0
      charge: 0.0

  # ============================================================================
  # 约束条件
  # ============================================================================
  constraints:
    enforce_mass_balance: false
    enforce_charge_balance: true
    min_count: 1
    max_count: 200000