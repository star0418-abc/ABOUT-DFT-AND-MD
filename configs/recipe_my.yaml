# [DEPRECATED] recipe_my.yaml - 已废弃，请使用 config/recipe.yaml
# ==============================================================================
# 
# ⚠️  此文件已废弃！仅保留作为模板参考。
# 
# 请使用统一配置:
#   config/recipe.yaml
#
# 新用法:
#   python3 scripts/recipe_to_counts.py -c config/recipe.yaml -o outputs/my_run
#   ./scripts/run_full.sh -c config/recipe.yaml -o outputs/my_run
#
# ==============================================================================
# [原始说明 - 仅供参考]
# ==============================================================================
# 字段说明:
#   - 你可以用 wt_pct (质量分数%) 或 mol_L (mol/L) 来指定组分比例
#   - 脚本会自动换算为每个组分的分子数 (count)
#   - 如果直接给出 count，则跳过换算直接使用
#
# 迁移到你自己的配方:
#   1. 修改 salt_solution 中的盐和溶剂
#   2. 修改 polymer_matrix 中的聚合物
#   3. 根据需要添加/删除 crosslinker 和 photoinitiator
#   4. 确保所有 pdb 文件存在于 molecules/ 目录
#   5. 确保 mw_g_mol 与你的分子一致
# ==============================================================================

# ==============================================================================
# 体系参数
# ==============================================================================
system:
  name: "my_gel_electrolyte"
  
  # 目标密度 (g/cm³) - 最终由 GROMACS NPT 达成
  target_density_g_cm3: 1.15
  
  # 盒子形状: cubic / rectangular
  box_shape: "cubic"
  
  # 基准质量 (g) - 用于 wt% 换算，默认 100g
  # 实际模拟会根据分子数缩放
  basis_mass_g: 100.0
  
  # 目标总分子数（可选，若指定则优先使用）
  # target_total_molecules: 500

# ==============================================================================
# Packmol 参数
# ==============================================================================
packmol:
  # 公差 (Å)
  tolerance_A: 2.0
  
  # 盒子放大系数 (1.0-2.0)，解决 Density Trap
  # 推荐 1.3-1.5，长链聚合物可用 1.6
  box_scale: 1.4
  
  # 随机种子 (-1 随机，正整数可复现)
  seed: 12345
  
  # 输出文件类型
  filetype: "pdb"
  output_pdb: "gel.pdb"

# ==============================================================================
# 盐溶液 (salt_solution)
# ==============================================================================
# 支持多个盐和溶剂
# 指定方式 (三选一):
#   - mol_L: 盐浓度 (mol/L)
#   - wt_pct: 质量分数 (%)
#   - count: 直接指定分子数
salt_solution:
  # 盐 (LiTFSI 示例)
  - id: "salt_litfsi"
    name: "LiTFSI"
    type: "salt"
    
    # 浓度指定方式 (二选一)
    # mol_L: 1.0           # mol/L 浓度
    wt_pct: 24.0           # 或用质量分数
    
    # 阳离子
    cation:
      name: "Li+"
      file: "molecules/Li.pdb"
      mw_g_mol: 6.941
      charge: +1
      stoichiometry: 1   # 每个盐式单元的阳离子数
    
    # 阴离子
    anion:
      name: "TFSI-"
      file: "molecules/TFSI.pdb"
      mw_g_mol: 280.13
      charge: -1
      stoichiometry: 1   # 每个盐式单元的阴离子数
  
  # 溶剂 (EC 示例)
  - id: "solvent_ec"
    name: "EC"
    type: "solvent"
    file: "molecules/EC.pdb"
    mw_g_mol: 88.06
    charge: 0
    
    # 溶剂通常用 wt% 或 count
    wt_pct: 30.0
    # count: 300         # 或直接指定分子数

# ==============================================================================
# 聚合物基质 (polymer_matrix)
# ==============================================================================
polymer_matrix:
  - id: "polymer_pegda"
    name: "PEGDA"
    file: "molecules/PEGDA.pdb"
    mw_g_mol: 575.0
    charge: 0
    
    # 指定方式 (三选一)
    wt_pct: 40.0
    # count: 10
    # mol_L: 0.5
    
    # HTPolyNet 反应位点信息 (可选)
    reactive_atoms: ["C1", "C2"]
    htpolynet_notes: "双键碳用于交联反应"

# ==============================================================================
# 交联剂 (crosslinker) - 可选
# ==============================================================================
crosslinker:
  - id: "crosslinker_tmpta"
    name: "TMPTA"
    file: "molecules/TMPTA.pdb"
    mw_g_mol: 296.32
    charge: 0
    
    wt_pct: 5.0
    # count: 3
    
    reactive_atoms: ["C1", "C2", "C3"]
    htpolynet_notes: "三官能团交联剂"

# ==============================================================================
# 光引发剂 (photoinitiator) - 可选
# ==============================================================================
photoinitiator:
  - id: "initiator_irgacure"
    name: "Irgacure2959"
    file: "molecules/Irgacure2959.pdb"
    mw_g_mol: 224.26
    charge: 0
    
    wt_pct: 1.0
    # count: 1

# ==============================================================================
# 约束与校验
# ==============================================================================
constraints:
  # 质量分数总和目标 (仅对 wt_pct 指定的组分)
  wt_pct_sum_target: 100.0
  wt_pct_tolerance: 1.0
  
  # 分子数范围
  min_count: 1
  max_count: 100000
  
  # 强制质量平衡
  enforce_mass_balance: true
  
  # 强制电荷平衡
  enforce_charge_balance: true

