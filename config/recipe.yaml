# ==============================================================================
# recipe.yaml - 凝胶电解质体系统一配置文件 (权威版本 v3.0)
# ==============================================================================
# 
# 【文件角色】
# 此文件是本项目的唯一权威配置入口，整合了：
#   - molecules:     分子定义（用于日志处理、验证）
#   - system:        体系参数
#   - packmol:       Packmol 打包参数
#   - 配方组件:       salt_solution / polymer_matrix / crosslinker / photoinitiator
#   - htpolynet:     HTPolyNet 交联参数
#   - gromacs:       GROMACS MDP 路径引用
#
# 【使用方式】
#   # 仅生成 PEGDA 交联网络
#   python scripts/build_pegda_network.py
#
#   # Packmol + GROMACS 完整流程
#   python scripts/recipe_to_counts.py -c config/recipe.yaml -o outputs/my_run
#   ./scripts/run_full.sh -c config/recipe.yaml -o outputs/my_run
#
# 【更新历史】
#   v3.0 (2025-12-31): 统一 config/ 和 configs/ 配置，增加 HTPolyNet 参数
#   v2.0 (2025-12-30): 增加分子定义 (molecules)
#   v1.0 (2025-12-27): 初始版本
#
# ==============================================================================


# ==============================================================================
# 分子定义 (molecules)
# ==============================================================================
# 用于：日志处理、原子数验证、电荷检查
# Schema:
#   <MOLECULE_KEY>:
#     natoms: <int>         # 必需：单分子原子数
#     net_charge: <int>     # 必需：净电荷 (0, -1, +1, ...)
#     resname: <str>        # 可选：残基名 (默认=分子名前3字符)
#     mw_g_mol: <float>     # 必需：分子量 (g/mol)
#     description: <str>    # 可选：描述
#
molecules:
  # --------------------------------------------------------------------------
  # 锂盐离子
  # --------------------------------------------------------------------------
  Li:
    natoms: 1
    net_charge: 1
    resname: LI
    mw_g_mol: 6.941
    description: "锂离子 (Li+)"

  TFSI:
    natoms: 15
    net_charge: -1
    resname: TFS
    mw_g_mol: 280.15
    description: "双(三氟甲磺酰)亚胺阴离子 (TFSI-)"

  # --------------------------------------------------------------------------
  # 溶剂分子
  # --------------------------------------------------------------------------
  FEP:
    natoms: 17
    net_charge: 0
    resname: FEP
    mw_g_mol: 156.10
    description: "氟代乙基碳酸丙烯酯 (FEP)"

  FEC:
    natoms: 10
    net_charge: 0
    resname: FEC
    mw_g_mol: 106.05
    description: "氟代碳酸乙烯酯 (FEC)"

  EC:
    natoms: 10
    net_charge: 0
    resname: EC
    mw_g_mol: 88.06
    description: "碳酸乙烯酯 (EC)"

  PC:
    natoms: 13
    net_charge: 0
    resname: PC
    mw_g_mol: 102.09
    description: "碳酸丙烯酯 (PC)"

  EMC:
    natoms: 13
    net_charge: 0
    resname: EMC
    mw_g_mol: 104.10
    description: "碳酸甲乙酯 (EMC)"

  # --------------------------------------------------------------------------
  # 聚合物/单体 - 用于 Packmol 直接打包
  # --------------------------------------------------------------------------
  PTFMA:
    natoms: 200
    net_charge: 0
    resname: PTF
    mw_g_mol: 5000.0
    description: "聚三氟甲基丙烯酸酯 (PTFMA) 低聚物"

  PEGDA:
    natoms: 101
    net_charge: 0
    resname: PEG
    mw_g_mol: 575.0
    description: "聚乙二醇二丙烯酸酯 (PEGDA)"

  # --------------------------------------------------------------------------
  # 交联剂单体 - 用于 HTPolyNet 交联
  # --------------------------------------------------------------------------
  EGDA:
    natoms: 26
    net_charge: 0
    resname: EGD
    mw_g_mol: 198.22
    description: "乙二醇二丙烯酸酯 (EGDA) - PEGDA 单体"
    # HTPolyNet 反应位点
    reactive_atoms:
      - HA   # 端A =CH2
      - TA   # 端A =CH-
      - HB   # 端B =CH2
      - TB   # 端B =CH-

  TMPTA:
    natoms: 44
    net_charge: 0
    resname: TMP
    mw_g_mol: 296.32
    description: "三羟甲基丙烷三丙烯酸酯 (TMPTA) - 三官能团交联剂"

  # --------------------------------------------------------------------------
  # 光引发剂
  # --------------------------------------------------------------------------
  Irgacure2959:
    natoms: 32
    net_charge: 0
    resname: IRG
    mw_g_mol: 224.26
    description: "Irgacure 2959 光引发剂"


# ==============================================================================
# 聚合参数 (polymerization)
# ==============================================================================
# 用于 mol2_to_polymer_mol2.py 生成寡聚体
# 
# 优先级: CLI --n_repeat > polymer_matrix[].oligomer_n > polymerization.oligomer_n
#
polymerization:
  # 默认聚合度 (三聚体)
  # ⚠️ 重要变更 (v2.0): 从 5 改为 3
  oligomer_n: 3
  
  # 单体分子量 (g/mol) - 用于 wt% 换算时自动计算寡聚体分子量
  # polymer_mw = oligomer_n × monomer_mw
  monomer_mw:
    EGDA: 198.22
    EO: 44.05
    MMA: 100.12
    VA: 86.09
    AM: 71.08
    TFEMA: 168.12


# ==============================================================================
# 体系参数 (system)
# ==============================================================================
system:
  name: "gel_electrolyte"
  
  # 目标密度 (g/cm³) - 最终由 GROMACS NPT 达成
  target_density_g_cm3: 1.20
  
  # 盒子形状: cubic / rectangular
  box_shape: "cubic"
  
  # 基准质量 (g) - 用于 wt% 换算
  basis_mass_g: 100.0
  
  # 目标总分子数（可选，若指定则覆盖 wt% 换算结果）
  # target_total_molecules: 500


# ==============================================================================
# Packmol 参数 (packmol)
# ==============================================================================
packmol:
  # 公差 (Å)
  tolerance_A: 2.0
  
  # 盒子放大系数 (1.0-2.0)
  # 推荐: 1.3-1.5 (小分子), 1.5-2.0 (长链聚合物)
  box_scale: 1.5

  # 若检测到 HTPolyNet 交联网络 + 盐，自动放大 Packmol 盒子以降低填充失败风险
  auto_box_scale_for_network: true
  network_box_scale_min: 2.0
  
  # 随机种子 (-1 随机，正整数可复现)
  seed: 2025
  
  # 输出文件类型
  filetype: "pdb"
  output_pdb: "gel.pdb"


# ==============================================================================
# 配方定义
# ==============================================================================
# 支持三种指定方式（每个组分三选一）:
#   - wt_pct:   质量分数 (%)
#   - mol_L:    摩尔浓度 (mol/L)
#   - count:    直接指定分子数
#
# 顺序: 盐溶液 → 聚合物基质 → 交联剂 → 光引发剂 → 溶剂
# ==============================================================================

# ------------------------------------------------------------------------------
# 配方 1: 仅 PEGDA 网络（dry polymer network）
# ------------------------------------------------------------------------------
# 用法:
#   python scripts/build_pegda_network.py --n_monomers 200 --conversion 0.8
#
# 输出:
#   mol2/PEGDA.mol2 (交联网络)
#   htpolynet_out/PEGDA/ (gro/top/itp)
#
# 注意: 此配方不走 Packmol 流程，直接使用 build_pegda_network.py

# ------------------------------------------------------------------------------
# 配方 2: PEGDA 网络 + LiTFSI（凝胶电解质）
# ------------------------------------------------------------------------------
# 此为默认激活配方，可直接用于 run_full.sh

salt_solution:
  # LiTFSI 盐
  - id: "salt_litfsi"
    name: "LiTFSI"
    type: "salt"
    
    # 浓度（二选一）
    # mol_L: 1.0              # mol/L
    wt_pct: 20.0              # 质量分数
    
    cation:
      name: "Li+"
      file: "molecules/Li.pdb"
      mw_g_mol: 6.941
      charge: +1
      stoichiometry: 1
    
    anion:
      name: "TFSI-"
      file: "molecules/TFSI.pdb"
      mw_g_mol: 280.15
      charge: -1
      stoichiometry: 1
  
  # 溶剂（可选）- 取消注释以启用
  # - id: "solvent_ec"
  #   name: "EC"
  #   type: "solvent"
  #   file: "molecules/EC.pdb"
  #   mw_g_mol: 88.06
  #   charge: 0
  #   wt_pct: 30.0

polymer_matrix:
  # PEGDA 聚合物网络（HTPolyNet 交联后输出）
  - id: "polymer_pegda"
    name: "PEGDA"
    file: "htpolynet_out/PEGDA/pegda_network_final.pdb"  # HTPolyNet 输出
    mw_g_mol: 39644.0  # 200 个 EGDA × 198.22 g/mol
    charge: 0
    
    # 使用交联网络作为整体
    count: 1
    
    # 标记来源
    source: "htpolynet"
    htpolynet_workdir: "htpolynet_out/PEGDA"
  
  # -----------------------------------------------------------
  # 备选: PEGDA 简化寡聚体 (用于快速测试)
  # 取消注释以下配置，同时注释上方的 HTPolyNet 配置
  # -----------------------------------------------------------
  # - id: "polymer_pegda_oligomer"
  #   name: "PEGDA"
  #   file: "mol2/PPEGDA.mol2"  # 由 mol2_to_polymer_mol2.py 生成
  #   
  #   # 寡聚体聚合度 (覆盖全局 polymerization.oligomer_n)
  #   oligomer_n: 3  # 三聚体
  #   
  #   # 分子量 = oligomer_n × 单体分子量
  #   # 如果指定 oligomer_n，脚本会自动计算: 3 × 198.22 = 594.66
  #   mw_g_mol: 594.66
  #   
  #   charge: 0
  #   wt_pct: 80.0  # 质量分数

# 交联剂（如果使用 HTPolyNet 交联，此处可留空或注释）
crosslinker: []

# 光引发剂（可选）
photoinitiator: []


# ==============================================================================
# 约束与校验 (constraints)
# ==============================================================================
constraints:
  # 质量分数总和目标
  wt_pct_sum_target: 100.0
  wt_pct_tolerance: 5.0  # 允许 5% 偏差（因为 PEGDA 用 count 指定）
  
  # 分子数范围
  min_count: 1
  max_count: 100000
  
  # 强制质量平衡
  enforce_mass_balance: false
  
  # 强制电荷平衡（LiTFSI 自动平衡）
  enforce_charge_balance: true


# ==============================================================================
# HTPolyNet 参数 (htpolynet)
# ==============================================================================
# 用于 build_pegda_network.py 生成交联网络
htpolynet:
  # 工作目录
  workdir: "htpolynet_out/PEGDA"
  
  # 输入单体
  building_block:
    source: "mol/EGDA.mol"
    active_form: "mol2/EGDA_active.mol2"
    resname: "EGD"
  
  # Cure 参数
  cure:
    n_monomers: 200
    desired_conversion: 0.80
    max_search_attempts: 1000
    cutoff_nm: 0.5
    random_seed: 2025
  
  # 反应定义
  reactions:
    - name: "crosslink_A"
      reactant1: {molecule: "EGDA", atom: "TA"}
      reactant2: {molecule: "EGDA", atom: "HA"}
      bond_order: 1
    
    - name: "crosslink_B"
      reactant1: {molecule: "EGDA", atom: "TB"}
      reactant2: {molecule: "EGDA", atom: "HB"}
      bond_order: 1
  
  # MD 参数
  densification:
    nsteps: 5000
    dt_ps: 0.001
    temperature_K: 300
  
  equilibration:
    nvt:
      nsteps: 10000
      dt_ps: 0.001
      temperature_K: 300
    npt:
      nsteps: 20000
      dt_ps: 0.002
      temperature_K: 300
      pressure_bar: 1.0
  
  # 盒子设置
  box:
    type: "cubic"
    initial_density_g_cm3: 0.5
  
  # 输出格式
  output:
    prefix: "pegda_network"
    formats: ["gro", "top", "pdb"]


# ==============================================================================
# GROMACS 参数引用 (gromacs)
# ==============================================================================
gromacs:
  # MDP 文件路径（相对于项目根目录）
  mdp_dir: "configs/mdp"
  
  mdp_files:
    em: "configs/mdp/em.mdp"
    nvt: "configs/mdp/nvt.mdp"
    npt: "configs/mdp/npt.mdp"
    npt_pr: "configs/mdp/npt_pr.mdp"  # 生产运行
  
  # 默认 MD 参数
  defaults:
    temperature_K: 300
    pressure_bar: 1.0
    em_steps: 50000
    nvt_steps: 50000
    npt_steps: 100000


# ==============================================================================
# 管道设置 (pipeline)
# ==============================================================================
pipeline:
  # antechamber 设置
  antechamber:
    atom_type: gaff2
    charge_method: gas  # 阶段 A 使用，CM5 在阶段 B 注入
  
  # 验证阈值
  validation:
    cluster_ratio_threshold: 1.5
    allow_unknown_molecules: false


# ==============================================================================
# 预定义配方模板 (recipes) - 可切换使用
# ==============================================================================
recipes:
  # ---- 配方 A: 仅 PEGDA 网络 ----
  pegda_network_only:
    description: "纯 PEGDA 交联网络（dry polymer network）"
    command: "python scripts/build_pegda_network.py"
    components: []  # 无需 Packmol
  
  # ---- 配方 B: PEGDA + LiTFSI ----
  pegda_litfsi:
    description: "PEGDA 网络 + LiTFSI 电解质"
    salt_solution:
      - {name: "LiTFSI", wt_pct: 20.0}
    polymer_matrix:
      - {name: "PEGDA", source: "htpolynet", count: 1}
  
  # ---- 配方 C: PEGDA + LiTFSI + EC 溶剂 ----
  pegda_litfsi_ec:
    description: "PEGDA 网络 + LiTFSI + EC 溶剂"
    salt_solution:
      - {name: "LiTFSI", wt_pct: 20.0}
      - {name: "EC", type: "solvent", wt_pct: 30.0}
    polymer_matrix:
      - {name: "PEGDA", source: "htpolynet", count: 1}
  
  # ---- 配方 D: WSGPE 复现 (PTFMA + LiTFSI + FEP + FEC) ----
  wsgpe_repro:
    description: "Nature Comm 2025 WSGPE 体系复现"
    components:
      - {name: "Li", file: "molecules/Li.pdb", count: 485, charge: 1}
      - {name: "TFSI", file: "molecules/TFSI.pdb", count: 485, charge: -1}
      - {name: "FEP", file: "molecules/FEP.pdb", count: 2325, charge: 0}
      - {name: "FEC", file: "molecules/FEC.pdb", count: 680, charge: 0}
      - {name: "PTFMA", file: "molecules/PTFMA.pdb", count: 50, charge: 0}


# ==============================================================================
# 注意事项
# ==============================================================================
# 1. 此文件是唯一权威配置，旧的 configs/recipe_*.yaml 已废弃
# 2. molecules 名称必须与 PDB/MOL2 文件名一致
# 3. natoms 必须精确，用于检测溶剂化簇
# 4. PEGDA 交联网络需先运行 build_pegda_network.py
# 5. 电荷平衡由 LiTFSI 的 stoichiometry 自动保证
