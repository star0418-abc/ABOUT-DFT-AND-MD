# =============================================================================
# HTPolyNet 配置文件 - PEGDA 交联网络
# 自动生成 by build_pegda_network.py
# =============================================================================

Title: PEGDA Crosslinked Network

# -----------------------------------------------------------------------------
# 分子定义
# -----------------------------------------------------------------------------
constituents:
  EGDA:
    count: 50
    source: "/home/edu/gel_packmol/htpolynet_out/PEGDA/EGDA_active.mol2"

# -----------------------------------------------------------------------------
# 反应定义
# -----------------------------------------------------------------------------
# EGDA 双官能团交联剂有两个反应端:
#   端 A: HA (=CH2) -- TA (=CH-)
#   端 B: HB (=CH2) -- TB (=CH-)
# 
# 交联反应: 一个分子的 TA 与另一个分子的 HA 成键
#           一个分子的 TB 与另一个分子的 HB 成键

reactions:
  # 反应1: A端交联
  - name: "crosslink_A"
    reactants:
      - molecule: EGDA
        atom: TA
      - molecule: EGDA
        atom: HA
    product_bond_order: 1
    
  # 反应2: B端交联  
  - name: "crosslink_B"
    reactants:
      - molecule: EGDA
        atom: TB
      - molecule: EGDA
        atom: HB
    product_bond_order: 1

# -----------------------------------------------------------------------------
# Cure 参数
# -----------------------------------------------------------------------------
cure:
  # 目标转化率
  desired_conversion: 0.8
  
  # 最大尝试次数
  max_search_attempts: 1000
  
  # 反应距离阈值 (nm)
  cutoff: 0.5
  
  # 随机种子
  random_seed: 2025

# -----------------------------------------------------------------------------
# MD 参数
# -----------------------------------------------------------------------------
densification:
  nsteps: 5000
  dt: 0.001  # ps
  temperature: 300  # K
  
equilibration:
  - name: "nvt"
    ensemble: nvt
    nsteps: 10000
    dt: 0.001
    temperature: 300
    
  - name: "npt"  
    ensemble: npt
    nsteps: 20000
    dt: 0.002
    temperature: 300
    pressure: 1.0  # bar

# -----------------------------------------------------------------------------
# 系统设置
# -----------------------------------------------------------------------------
box:
  type: cubic
  initial_density: 0.5  # g/cm³ (初始低密度便于打包)

output:
  prefix: "pegda_network"
  formats:
    - gro
    - top
    - pdb
